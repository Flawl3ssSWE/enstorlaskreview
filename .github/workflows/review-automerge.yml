name: Review automerge policy
on:
  pull_request:
    types:
      [
        opened,
        synchronize,
        reopened,
        edited,
        ready_for_review,
        auto_merge_enabled,
        auto_merge_disabled
      ]
permissions:
  contents: read
concurrency:
  group: review-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review-automerge-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Check current PR and automatic merge eligibility
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/review-changes.ts --policy
