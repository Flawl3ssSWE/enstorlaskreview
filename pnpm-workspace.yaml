packages:
  - '.'
engineStrict: true
savePrefix: ''
minimumReleaseAge: 10080
strictDepBuilds: true
allowBuilds:
  '@tailwindcss/oxide': false
  '@parcel/watcher': false
verifyStoreIntegrity: true
blockExoticSubdeps: true
verifyDepsBeforeRun: error
minimumReleaseAgeIgnoreMissingTime: false
# Patch vulnerable transitive packages while staying within their major versions.
overrides:
  'brace-expansion@<1.1.21': 1.1.21
  'brace-expansion@>=2.0.0 <2.1.7': 2.1.7
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'nanoid@>=3.0.0 <3.3.18': 3.3.18
  'devalue@>=5.0.0 <5.9.3': 5.9.3
  '@humanfs/node@<0.16.8': 0.16.8
  'cookie@>=0.6.0 <0.7.0': 0.7.2
